<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单 TODO 应用</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📝 我的任务清单</h1>
        
        <div class="input-group">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="输入新任务..."
                class="todo-input"
            >
            <button id="addBtn" class="add-btn">添加任务</button>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- 任务将动态插入这里 -->
        </ul>

        <div class="stats">
            <span>总任务数：<strong id="totalCount">0</strong></span>
            <span>已完成：<strong id="completedCount">0</strong></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
